<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 보조 도구 설정 검토</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; background: #f5f7fb; color:#1f2937; }
    .container { max-width: 900px; margin: 40px auto; padding: 0 16px; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); padding: 24px; }
    h1 { margin-top: 0; font-size: 28px; }
    .hint { color:#4b5563; margin-bottom: 18px; }
    pre { white-space: pre-wrap; word-break: keep-all; line-height: 1.6; background:#0f172a; color:#e2e8f0; padding:16px; border-radius:10px; overflow:auto; }
    a { color:#2563eb; text-decoration: none; }
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>AI 보조 도구 웹 설정 검토</h1>
      <p class="hint">로컬 개발 서버에서 바로 확인할 수 있도록 정적 페이지를 준비했습니다.</p>
      <p><a href="ai_tool_setup_review.md" target="_blank" rel="noreferrer">원본 마크다운 보기</a></p>
      <pre id="content">로딩 중...</pre>
    </section>
  </main>

  <script>
    fetch('ai_tool_setup_review.md')
      .then((res) => res.text())
      .then((text) => {
        document.getElementById('content').textContent = text;
      })
      .catch(() => {
        document.getElementById('content').textContent = '파일을 불러오지 못했습니다.';
      });
  </script>
</body>
</html>
